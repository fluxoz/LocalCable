[project]
name = "localcable"
version = "0.1.0"
description = "Folder-to-channel living electronic program guide for local media."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LocalCable" }]
keywords = ["epg", "iptv", "mpv", "media", "guide"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
localcable = "localcable.main:main"

[project.urls]
Homepage = "https://github.com/localcable/localcable"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localcable"]

[tool.hatch.build.targets.wheel.force-include]
"src/localcable/static" = "localcable/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]
