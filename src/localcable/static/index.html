<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalCable Guide</title>
  <link rel="stylesheet" href="/static/guide.css">
</head>
<body>
  <div id="guide">
    <header id="guide-header">
      <div id="header-top">
        <img id="provider-logo" src="/logo" alt="Provider logo">
        <div id="header-labels">
          <span id="header-label" class="with-mail">TV Listings</span>
          <span id="clock" aria-live="polite"></span>
        </div>
      </div>
      <section id="detail-panel" aria-live="polite">
        <div id="detail-main">
          <div id="detail-title-row">
            <h1 id="detail-title">Select a program</h1>
            <span id="detail-channel"></span>
            <span id="detail-rating">No rating</span>
          </div>
          <div id="detail-time"></div>
          <p id="detail-description">Point LocalCable at a media folder. Each subfolder becomes a channel.</p>
          <button type="button" id="play-button" disabled>Watch</button>
        </div>
        <div id="detail-thumb">
          <div class="thumb-placeholder">TV</div>
          <img id="detail-art" alt="" hidden>
          <div id="video-overlay" hidden>
            <span id="video-overlay-live">On now</span>
            <div id="video-overlay-title"></div>
            <div id="video-overlay-channel"></div>
          </div>
        </div>
      </section>
    </header>

    <div id="guide-body">
      <button type="button" id="scroll-earlier" class="time-nav" aria-label="Scroll earlier">‹</button>
      <button type="button" id="scroll-later" class="time-nav" aria-label="Scroll later">›</button>
      <div id="grid-scroll">
        <div id="time-bar-label">Today</div>
        <div id="time-axis"></div>
        <div id="channel-column"></div>
        <div id="program-grid">
          <div id="now-line"></div>
        </div>
      </div>
    </div>

    <footer id="guide-footer">
      <span id="footer-status">Arrows move · OK/Enter watch · Esc guide · CH+/− or numbers tune · i info</span>
      <span id="footer-meta"></span>
    </footer>
  </div>

  <div id="stage" hidden>
    <video id="player" playsinline preload="metadata"></video>
    <div id="hud" hidden>
      <div id="hud-top">
        <span id="hud-live">On now</span>
        <div id="hud-copy">
          <div id="hud-title"></div>
          <div id="hud-channel"></div>
        </div>
      </div>
      <div id="hud-bottom">
        <input id="hud-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <div id="hud-row">
          <button type="button" id="hud-back">Guide</button>
          <button type="button" id="hud-play">Play</button>
          <button type="button" id="hud-restart">Start over</button>
          <span id="hud-time">0:00 / 0:00</span>
          <button type="button" id="hud-mute">Mute</button>
          <input id="hud-volume" type="range" min="0" max="100" value="100" aria-label="Volume">
          <button type="button" id="hud-ch-down">CH−</button>
          <button type="button" id="hud-ch-up">CH+</button>
          <button type="button" id="hud-info">Info</button>
          <button type="button" id="hud-fs">Full</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/dash.all.min.js"></script>
  <script src="/static/guide.js"></script>
</body>
</html>
